<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#140a26">
<title>致 陈婷婷 · 生日快乐</title>
<style>
  :root{
    --pink:#ff7eb6; --pink2:#ff4f93; --gold:#ffd98a; --violet:#b98bff; --soft:#fff2f8;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;overflow:hidden}
  body{
    font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
    background:#0a0616;color:#fff;position:relative;user-select:none;overflow:hidden;
  }
  /* 流动极光 */
  .aurora{position:fixed;inset:-20%;z-index:0;filter:blur(60px);opacity:.8}
  .aurora i{position:absolute;border-radius:50%;mix-blend-mode:screen}
  .a1{width:46vmax;height:46vmax;left:-6%;top:-8%;background:#7b4dff;animation:drift1 16s ease-in-out infinite}
  .a2{width:40vmax;height:40vmax;right:-10%;top:10%;background:#ff4f93;animation:drift2 19s ease-in-out infinite}
  .a3{width:38vmax;height:38vmax;left:18%;bottom:-14%;background:#ffb347;animation:drift3 22s ease-in-out infinite}
  .a4{width:30vmax;height:30vmax;right:6%;bottom:-6%;background:#2ad6ff;animation:drift1 21s ease-in-out infinite reverse}
  @keyframes drift1{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(12%,8%) scale(1.15)}}
  @keyframes drift2{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(-10%,12%) scale(1.1)}}
  @keyframes drift3{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(8%,-10%) scale(1.12)}}

  .stars,.petals,.meteor{position:fixed;inset:0;pointer-events:none;z-index:1;overflow:hidden}
  .star{position:absolute;background:#fff;border-radius:50%;animation:tw 3s infinite ease-in-out}
  @keyframes tw{0%,100%{opacity:.15;transform:scale(.8)}50%{opacity:1;transform:scale(1)}}
  .petal{position:absolute;top:-8%;font-size:20px;animation:fall linear infinite;will-change:transform}
  @keyframes fall{to{transform:translateY(860px) rotate(320deg)}}
  .meteor{opacity:0}
  .meteor b{position:absolute;top:8%;left:70%;width:140px;height:2px;border-radius:2px;
    background:linear-gradient(90deg,transparent,#fff);transform:rotate(35deg);
    box-shadow:0 0 8px #fff;animation:shoot 5s ease-in infinite}
  @keyframes shoot{0%{opacity:0;transform:translate(0,0) rotate(35deg)}
    6%{opacity:1}14%{opacity:0;transform:translate(-260px,182px) rotate(35deg)}100%{opacity:0}}

  canvas{position:fixed;inset:0;z-index:6;pointer-events:none}

  /* 开场信封 */
  #gate{position:fixed;inset:0;z-index:30;display:flex;flex-direction:column;align-items:center;justify-content:center;
    background:rgba(8,5,20,.72);backdrop-filter:blur(10px);transition:opacity 1s;padding:24px;text-align:center}
  #gate h1{font-size:clamp(20px,6vw,26px);font-weight:300;letter-spacing:3px;color:var(--gold);margin-bottom:6px}
  #gate p{font-size:clamp(12px,3.6vw,14px);color:#c9b8e8;margin-bottom:26px}
  .env{width:min(240px,72vw);height:160px;position:relative;perspective:900px;margin:0 auto 8px}
  .env .back{position:absolute;inset:0;background:linear-gradient(160deg,#fff,#ffe1ee);border-radius:10px;
    box-shadow:0 18px 40px rgba(0,0,0,.45)}
  .env .pocket{position:absolute;bottom:0;left:0;right:0;height:62%;
    background:linear-gradient(160deg,#ffd9e8,#ffb6d4);border-radius:0 0 10px 10px;
    clip-path:polygon(0 36%,50% 100%,100% 36%,100% 100%,0 100%)}
  .env .flap{position:absolute;top:0;left:0;right:0;height:64%;
    background:linear-gradient(160deg,#ffc2dd,#ff9ec6);border-radius:10px 10px 0 0;
    clip-path:polygon(0 0,100% 0,50% 100%);transform-origin:top center;
    transition:transform .9s cubic-bezier(.6,.1,.3,1);z-index:3;box-shadow:0 6px 14px rgba(0,0,0,.25)}
  .env .wax{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);z-index:4;
    width:46px;height:46px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ff8ab5,#d6336c);
    display:flex;align-items:center;justify-content:center;font-size:22px;color:#fff;
    box-shadow:0 4px 12px rgba(214,51,108,.6);transition:opacity .5s}
  .env .addr{position:absolute;left:0;right:0;bottom:30px;z-index:5;text-align:center;line-height:1;
    color:#b8396e;pointer-events:none;transition:opacity .5s}
  .env .addr .to{font-size:20px;font-weight:700;letter-spacing:3px;font-family:"STKaiti","KaiTi",cursive;
    text-shadow:0 1px 1px rgba(255,255,255,.7)}
  .env .addr .qin{margin-left:8px;font-size:13px;letter-spacing:2px;font-family:"STKaiti","KaiTi",cursive;opacity:.8}
  #gate.open .addr{opacity:0}
  #gate.open .flap{transform:rotateX(180deg)}
  #gate.open .wax{opacity:0}
  #gate.open .letter{transform:translateY(-40px) scale(1);opacity:1}
  .letter{position:absolute;left:8%;right:8%;top:10%;height:78%;background:#fff7fb;border-radius:6px;
    box-shadow:0 10px 24px rgba(0,0,0,.3);transform:translateY(20px) scale(.9);opacity:0;
    transition:.9s cubic-bezier(.6,.1,.3,1);z-index:1;display:flex;align-items:center;justify-content:center;
    font-size:13px;color:#c44d86;letter-spacing:2px}
  #openBtn{margin-top:26px;padding:14px 42px;border:none;border-radius:999px;
    background:linear-gradient(135deg,var(--pink),var(--pink2));color:#fff;font-size:16px;letter-spacing:4px;
    cursor:pointer;box-shadow:0 10px 30px rgba(255,79,147,.55);animation:pulse 2s infinite}
  @keyframes pulse{0%,100%{box-shadow:0 10px 30px rgba(255,79,147,.45)}50%{box-shadow:0 10px 46px rgba(255,79,147,.85)}}
  #openBtn:active{transform:scale(.96)}

  /* 主舞台 */
  #stage{position:fixed;inset:0;z-index:10;opacity:0;pointer-events:none;transition:opacity 1.2s ease;
    overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch}
  #stage.show{opacity:1;pointer-events:auto}
  .scroll-inner{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;
    padding:58px 18px 168px;width:100%}
  .badge{display:inline-block;font-size:11px;letter-spacing:5px;color:var(--gold);
    border:1px solid rgba(255,217,138,.45);border-radius:999px;padding:5px 16px;margin-bottom:18px;
    opacity:0;animation:fadeUp 1s forwards;animation-delay:.2s}

  .avatar-wrap{position:relative;width:clamp(150px,42vw,200px);height:clamp(150px,42vw,200px);margin-bottom:18px;
    opacity:0;animation:fadeUp 1s forwards;animation-delay:.4s}
  .avatar-ring{position:absolute;inset:-13px;border-radius:50%;
    background:conic-gradient(from 0deg,#ff7eb6,#ffd98a,#8be9fd,#b98bff,#ff7eb6);
    -webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 4px),#000 calc(100% - 3px));
    mask:radial-gradient(farthest-side,transparent calc(100% - 4px),#000 calc(100% - 3px));
    animation:spin 7s linear infinite}
  .avatar-ring2{position:absolute;inset:-24px;border-radius:50%;
    border:1.5px dashed rgba(255,217,138,.5);animation:spin 18s linear infinite reverse}
  @keyframes spin{to{transform:rotate(360deg)}}
  .avatar{width:100%;height:100%;border-radius:50%;object-fit:cover;object-position:50% 26%;
    border:4px solid rgba(255,255,255,.92);box-shadow:0 0 34px rgba(255,94,147,.7),0 0 90px rgba(185,139,255,.5)}
  .orb{position:absolute;font-size:18px;animation:orbit 6s ease-in-out infinite}
  .o1{top:-6px;left:6%}.o2{top:14%;right:-6px;animation-delay:1.2s}
  .o3{bottom:2%;left:-4px;animation-delay:2.4s}.o4{bottom:-4px;right:10%;animation-delay:3.2s}
  @keyframes orbit{0%,100%{transform:translateY(0) scale(1);opacity:.9}50%{transform:translateY(-10px) scale(1.18);opacity:1}}

  .name{font-family:"STKaiti","Kaiti SC","KaiTi","Songti SC",serif;
    font-size:clamp(40px,12vw,60px);font-weight:700;letter-spacing:6px;line-height:1.15;margin-bottom:4px;
    background:linear-gradient(135deg,#fff6d8,var(--gold) 35%,var(--pink) 70%,var(--violet));
    -webkit-background-clip:text;background-clip:text;color:transparent;
    filter:drop-shadow(0 3px 18px rgba(255,126,182,.55));opacity:0;animation:fadeUp 1s forwards;animation-delay:.6s}
  .name span{display:inline-block;opacity:0;transform:translateY(26px) scale(.6);
    animation:pop .7s forwards cubic-bezier(.2,1.4,.5,1)}
  @keyframes pop{to{opacity:1;transform:translateY(0) scale(1)}}
  .birthday{font-size:clamp(15px,4.4vw,18px);letter-spacing:8px;color:#ffe9f4;font-weight:300;margin-bottom:18px;
    text-shadow:0 0 18px rgba(255,126,182,.6);opacity:0;animation:fadeUp 1s forwards;animation-delay:.8s}

  .letter-box{max-width:460px;width:100%;min-height:120px;text-align:left;margin:0 0 34px}
  .line{font-size:clamp(14px,4.1vw,16px);font-weight:300;line-height:1.9;color:#f3ebff;letter-spacing:.5px;
    opacity:0;transform:translateY(16px);transition:opacity .9s ease,transform .9s ease;margin:6px 0}
  .line.show{opacity:1;transform:translateY(0)}
  .line .hl{color:var(--pink);font-weight:600}
  .line .gold{color:var(--gold);font-weight:600}

  .sign{margin-top:16px;font-size:13px;color:#b39ddb;letter-spacing:2px;opacity:0;animation:fadeUp 1.2s forwards;animation-delay:.4s;text-align:center}
  .heartbeat{display:inline-block;color:var(--pink);animation:beat 1s infinite;font-size:16px}
  @keyframes beat{0%,100%{transform:scale(1)}25%{transform:scale(1.25)}50%{transform:scale(1)}}
  @keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}

  /* 收集我爱 彩蛋 */
  .love{position:fixed;left:50%;bottom:64px;transform:translateX(-50%);z-index:12;text-align:center;
    opacity:0;animation:fadeUp 1s forwards;animation-delay:1.4s}
  .love button{border:1px solid rgba(255,126,182,.5);background:rgba(255,126,182,.12);color:#ffd0e3;
    padding:10px 22px;border-radius:999px;font-size:14px;letter-spacing:1px;cursor:pointer;backdrop-filter:blur(4px)}
  .love button:active{transform:scale(.95)}
  .love .cnt{display:block;font-size:12px;color:#ff9ec6;margin-top:6px;letter-spacing:1px}

  .tip{position:fixed;bottom:20px;width:100%;text-align:center;font-size:12px;color:#9d8bc5;z-index:11;
    opacity:0;animation:fadeUp 1s forwards;animation-delay:1.6s}

  .music{position:fixed;top:16px;right:16px;z-index:40;width:52px;height:52px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;cursor:pointer;overflow:hidden;
    background:radial-gradient(circle at 32% 24%,rgba(255,255,255,.32),rgba(255,255,255,.07) 64%);
    border:1px solid rgba(255,255,255,.32);
    backdrop-filter:blur(6px);box-shadow:0 4px 16px rgba(0,0,0,.38);transition:filter .3s,opacity .3s}
  .music svg{display:block;width:40px;height:40px}
  /* 旋转木马：外壳（顶篷/中柱/底座）静止，只有两匹马绕中柱转圈 */
  .music .ride{transform-box:view-box}
  .music.playing #rideR{animation:rideR 11s linear infinite;transform-origin:27.2px 23.8px}
  .music.playing #rideL{animation:rideL 11s linear infinite;transform-origin:12.8px 23.8px}
  @keyframes rideR{
    0%{transform:translate(0,-1.5px) scale(.82);opacity:.85}
    25%{transform:translate(-7.2px,-3.1px) scale(.6);opacity:.5}
    50%{transform:translate(-14.4px,-1.5px) scale(.82);opacity:.85}
    75%{transform:translate(-7.2px,.4px) scale(1);opacity:1}
    100%{transform:translate(0,-1.5px) scale(.82);opacity:.85}
  }
  @keyframes rideL{
    0%{transform:translate(0,-1.5px) scale(.82);opacity:.85}
    25%{transform:translate(7.2px,.4px) scale(1);opacity:1}
    50%{transform:translate(14.4px,-1.5px) scale(.82);opacity:.85}
    75%{transform:translate(7.2px,-3.1px) scale(.6);opacity:.5}
    100%{transform:translate(0,-1.5px) scale(.82);opacity:.85}
  }
  .music.off{filter:grayscale(.55) brightness(.82);opacity:.8}
  .music.off svg{opacity:.5}
  .music.off::after{content:'';position:absolute;width:44px;height:2px;border-radius:2px;
    background:rgba(255,255,255,.9);box-shadow:0 0 5px rgba(0,0,0,.55);transform:rotate(-45deg)}

  /* 蛋糕 + 鲜花 并排 */
  .duo{display:flex;align-items:flex-end;justify-content:center;gap:clamp(4px,3vw,20px);
    width:100%;max-width:430px;margin:0 auto 10px;padding:0 2px}
  .duo>*{flex:0 0 auto}

  /* 蛋糕 */
  .cake-wrap{margin:0;opacity:0;animation:fadeUp 1s forwards;animation-delay:1s}
  .cake-wrap svg{display:block;width:clamp(132px,40vw,178px);height:auto;
    filter:drop-shadow(0 16px 30px rgba(255,94,147,.42));animation:floaty 5.5s ease-in-out infinite}
  @keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
  /* 火焰：SVG 子元素的百分比 transform-origin 默认按 view-box 解析，必须显式 fill-box，
     否则缩放原点会落到 viewBox 底部（110,212），火苗被顶出上边缘裁掉 */
  .flame{transform-box:fill-box;transform-origin:50% 100%;animation:flick 1.5s ease-in-out infinite}
  @keyframes flick{0%,100%{transform:scaleY(1);opacity:.92}50%{transform:scaleY(1.16);opacity:1}}
  .glow{animation:glowPulse 2.4s ease-in-out infinite}
  @keyframes glowPulse{0%,100%{opacity:.45}50%{opacity:.95}}

  /* 照片墙 */
  .gallery{position:relative;display:flex;justify-content:center;margin:0 0 14px;
    opacity:0;animation:fadeUp 1.1s forwards;animation-delay:1.25s}
  .polar{background:#fff;padding:8px 8px 30px;border-radius:5px;position:relative;
    box-shadow:0 16px 34px rgba(0,0,0,.45);transform:rotate(-3deg);transition:transform .5s}
  .polar img{display:block;width:clamp(128px,37vw,164px);height:clamp(168px,49vw,216px);
    object-fit:cover;border-radius:2px}
  .polar .cap{position:absolute;bottom:6px;left:0;right:0;text-align:center;
    font-family:"STKaiti","Kaiti SC","KaiTi",serif;font-size:12px;color:#c44d86;letter-spacing:2px}
  .polar .tape{position:absolute;top:-9px;left:50%;transform:translateX(-50%) rotate(-3deg);
    width:62px;height:18px;background:rgba(255,255,255,.5);border-radius:2px;
    box-shadow:0 2px 6px rgba(0,0,0,.18)}
  .polar:active{transform:rotate(0deg) scale(1.04)}

  /* 鲜花花束（玻璃纸包装 + 印字，照照片） */
  .florals{position:relative;display:flex;justify-content:center;margin:0;
    opacity:0;animation:fadeUp 1.1s forwards;animation-delay:1.5s}
  .florals svg{display:block;width:clamp(136px,42vw,182px);height:auto;
    transform-origin:50% 96%;animation:sway 6s ease-in-out infinite;
    filter:drop-shadow(0 14px 26px rgba(0,0,0,.45))}
  @keyframes sway{0%,100%{transform:rotate(-1.2deg)}50%{transform:rotate(1.2deg)}}
</style>
</head>

  <div class="aurora"><i class="a1"></i><i class="a2"></i><i class="a3"></i><i class="a4"></i></div>
  <div class="stars" id="stars"></div>
  <div class="petals" id="petals"></div>
  <div class="meteor"><b></b></div>

      <g transform="translate(27.2 23.8) scale(-1 1)">
        <path d="M-2.9 -0.5 q-1.5 1.4 -1.05 3.2" stroke="#fff4fa" stroke-width=".9" fill="none" stroke-linecap="round"/>
        <ellipse cx="0" cy="0" rx="3.2" ry="1.85" fill="#fff4fa"/>
        <path d="M2.1 -1.5 L3.1 -4.5 L4.9 -3.7 L3.8 -0.6 Z" fill="#fff4fa"/>
        <circle cx="4.7" cy="-3.9" r=".5" fill="#4a2c18"/>
        <path d="M-2.0 1.5 L-2.5 3.9 M0.2 1.6 L0.4 4.0 M2.0 1.4 L2.9 3.7"
          stroke="#fff4fa" stroke-width=".85" stroke-linecap="round"/>
        <path d="M-1.3 -0.5 q1.3 -0.8 1.5 1 q.1 1 -1.4 1.1 Z" fill="#ff7eb6"/>
      </g>
      </g>

      <!-- 左马（绕中柱转圈） -->
      <g class="ride" id="rideL">
      <path d="M12.8 16.2 V22.4" stroke="#ffd98a" stroke-width="1" stroke-linecap="round"/>
      <g transform="translate(12.8 23.8)">
        <path d="M-2.9 -0.5 q-1.5 1.4 -1.05 3.2" stroke="#fff4fa" stroke-width=".9" fill="none" stroke-linecap="round"/>
        <ellipse cx="0" cy="0" rx="3.2" ry="1.85" fill="#fff4fa"/>
        <path d="M2.1 -1.5 L3.1 -4.5 L4.9 -3.7 L3.8 -0.6 Z" fill="#fff4fa"/>
        <circle cx="4.7" cy="-3.9" r=".5" fill="#4a2c18"/>
        <path d="M-2.0 1.5 L-2.5 3.9 M0.2 1.6 L0.4 4.0 M2.0 1.4 L2.9 3.7"
          stroke="#fff4fa" stroke-width=".85" stroke-linecap="round"/>
        <path d="M-1.3 -0.5 q1.3 -0.8 1.5 1 q.1 1 -1.4 1.1 Z" fill="#b98bff"/>
      </g>
      </g>

      <!-- 底座 -->
      <ellipse cx="20" cy="30.2" rx="11.2" ry="3.1" fill="url(#mcBase)"/>
      <ellipse cx="20" cy="29.5" rx="11.2" ry="2.5" fill="#fff" opacity=".5"/>
      <ellipse cx="20" cy="30.6" rx="7.4" ry="1.6" fill="#ff9ec6" opacity=".4"/>
    </svg>
  </div>

<script>
  const NAME = "陈婷婷";
  const LINES = [
    "今天的世界，因为你而变得格外温柔。",
    "愿你眼里的<span class='gold'>星光</span>永不熄灭，笑容永远<span class='hl'>甜甜的</span>。",
    "往后的每一岁，都比上一岁更快乐、更自由。",
    "谢谢你来到我身边，让我觉得——<span class='hl'>人间真的值得</span>。"
  ];
  const SECRET = "其实我想说的是：无论多少个生日，我都想在身边陪你一起过。";

  const stars=document.getElementById('stars');
  for(let i=0;i<140;i++){
    const s=document.createElement('div');s.className='star';
    const sz=Math.random()*2+1;s.style.width=sz+'px';s.style.height=sz+'px';
    s.style.left=Math.random()*100+'%';s.style.top=Math.random()*100+'%';
    s.style.animationDelay=Math.random()*3+'s';stars.appendChild(s);
  }
  const petals=document.getElementById('petals');
  setInterval(()=>{
    const p=document.createElement('div');p.className='petal';
    p.textContent=['🌸','💗','🌸','✨','💖'][Math.floor(Math.random()*5)];
    p.style.left=Math.random()*100+'%';p.style.animationDuration=(7+Math.random()*6)+'s';
    p.style.fontSize=(15+Math.random()*13)+'px';
    petals.appendChild(p);setTimeout(()=>p.remove(),14000);
  },550);

  const nameEl=document.getElementById('name');
  NAME.split('').forEach((c,i)=>{const sp=document.createElement('span');
    sp.textContent=c;sp.style.animationDelay=(0.9+i*0.15)+'s';nameEl.appendChild(sp);});

  const letterBox=document.getElementById('letterBox');
  function showLetters(){
    LINES.forEach((t,i)=>{
      const d=document.createElement('div');d.className='line';d.innerHTML=t;letterBox.appendChild(d);
      setTimeout(()=>d.classList.add('show'), i*1100);
    });
  }

  // 鲜花花束（照照片：浅绿玫瑰 + 桔梗花苞，透明玻璃纸包装，印 I believe good things happen every day.）
  (function(){
    const box=document.getElementById('florals');
    const R1='#e9f1cf',R2='#d3e3ac',R3='#bcd28e';
    const W1='#f8fbe9',W2='#e7efd2',W3='#d1deaa';
    const B1='#c6da97',B2='#a2bd67',B3='#7f9b4d';
    const L1='#a9c47a',L2='#8fae5e',STEM='#9cb96c';

    function rose(cx,cy,r,c1,c2,c3){
      let s='<g transform="translate('+cx+' '+cy+')">';
      s+='<circle r="'+r.toFixed(1)+'" fill="'+c3+'"/>';
      const pos=[0,51,103,154,206,257,309], dly=[0,9,-6,11,-4,7,-9];
      const scw=[[.46,.60],[.43,.57],[.48,.62],[.42,.55],[.46,.60],[.44,.58],[.47,.61]];
      for(let k=0;k<7;k++){
        s+='<ellipse cx="0" cy="'+(-r*0.5).toFixed(1)+'" rx="'+(scw[k][0]*r).toFixed(1)+'" ry="'+(scw[k][1]*r).toFixed(1)
          +'" fill="'+c1+'" transform="rotate('+(pos[k]+dly[k])+')"/>';
      }
      const pos2=[20,92,164,236,308], dly2=[6,-8,4,-5,8];
      for(let k=0;k<5;k++){
        s+='<ellipse cx="0" cy="'+(-r*0.28).toFixed(1)+'" rx="'+(r*0.34).toFixed(1)+'" ry="'+(r*0.42).toFixed(1)
          +'" fill="'+c2+'" transform="rotate('+(pos2[k]+dly2[k])+')"/>';
      }
      s+='<path d="M0 0 a2.4 2.4 0 1 1 4.8 0 a5 5 0 1 1 -10 0 a7.6 7.6 0 1 1 15.2 0 a10.2 10.2 0 1 1 -20.4 0"'
        +' fill="none" stroke="'+c3+'" stroke-width="'+(r*0.10).toFixed(2)+'" stroke-linecap="round" opacity=".5"'
        +' transform="scale('+(r/11.4).toFixed(3)+')"/>';
      s+='<circle r="'+(r*0.13).toFixed(1)+'" fill="'+c3+'"/>';
      return s+'</g>';
    }
    function bud(cx,cy,r,rot,c1,c2){
      let s='<g transform="translate('+cx+' '+cy+') rotate('+rot+')">';
      s+='<path d="M0 '+(-r*1.16).toFixed(1)+' C'+(r*0.98).toFixed(1)+' '+(-r*0.66).toFixed(1)+' '+(r*0.82).toFixed(1)+' '+(r*0.42).toFixed(1)+' 0 '+r.toFixed(1)
        +' C'+(-r*0.82).toFixed(1)+' '+(r*0.42).toFixed(1)+' '+(-r*0.98).toFixed(1)+' '+(-r*0.66).toFixed(1)+' 0 '+(-r*1.16).toFixed(1)+' Z" fill="'+c1+'"/>';
      s+='<path d="M0 '+(-r*1.16).toFixed(1)+' L0 '+r.toFixed(1)+'" stroke="'+c2+'" stroke-width="'+(r*0.13).toFixed(2)+'" opacity=".45"/>';
      s+='<path d="M0 '+(-r*1.16).toFixed(1)+' C'+(-r*0.5).toFixed(1)+' '+(-r*0.4).toFixed(1)+' '+(-r*0.6).toFixed(1)+' '+(r*0.2).toFixed(1)+' '+(-r*0.32).toFixed(1)+' '+r.toFixed(1)
        +'" fill="none" stroke="'+c2+'" stroke-width="'+(r*0.1).toFixed(2)+'" opacity=".35"/>';
      s+='<path d="M0 '+(-r*1.16).toFixed(1)+' C'+(r*0.5).toFixed(1)+' '+(-r*0.4).toFixed(1)+' '+(r*0.6).toFixed(1)+' '+(r*0.2).toFixed(1)+' '+(r*0.32).toFixed(1)+' '+r.toFixed(1)
        +'" fill="none" stroke="'+c2+'" stroke-width="'+(r*0.1).toFixed(2)+'" opacity=".35"/>';
      s+='<ellipse cx="0" cy="'+(-r*0.25).toFixed(1)+'" rx="'+(r*0.17).toFixed(1)+'" ry="'+(r*0.42).toFixed(1)+'" fill="#fbfdf2" opacity=".4"/>';
      return s+'</g>';
    }
    function leaf(cx,cy,len,rot,c,w){
      w=w||0.19;
      return '<g transform="translate('+cx+' '+cy+') rotate('+rot+')">'
        +'<path d="M0 0 C'+(len*w).toFixed(1)+' '+(-len*0.3).toFixed(1)+' '+(len*w).toFixed(1)+' '+(-len*0.7).toFixed(1)+' 0 '+(-len)
        +' C'+(-len*w).toFixed(1)+' '+(-len*0.7).toFixed(1)+' '+(-len*w).toFixed(1)+' '+(-len*0.3).toFixed(1)+' 0 0 Z" fill="'+c+'"/>'
        +'<path d="M0 0 L0 '+(-len*0.9).toFixed(1)+'" stroke="rgba(255,255,255,.42)" stroke-width="0.8"/></g>';
    }

    let s='<svg viewBox="0 0 220 268" fill="none" xmlns="http://www.w3.org/2000/svg"><defs>'
      +'<linearGradient id="fWrap" x1="0" y1="0" x2="1" y2="0.35">'
      +'<stop offset="0" stop-color="#eef3d6"/><stop offset=".42" stop-color="#d6e4ae"/><stop offset="1" stop-color="#a8c37b"/></linearGradient>'
      +'<linearGradient id="fGlass" x1="0" y1="0" x2="1" y2="0.6">'
      +'<stop offset="0" stop-color="#ffffff" stop-opacity=".34"/><stop offset=".45" stop-color="#eaf3ff" stop-opacity=".13"/>'
      +'<stop offset="1" stop-color="#cfe0ff" stop-opacity=".24"/></linearGradient>'
      +'<clipPath id="fClip"><path d="M38 116 C56 162 78 210 96 246 L124 246 C142 210 164 162 182 116 Z"/></clipPath>'
      +'</defs>';

    // 花枝
    s+='<g stroke="'+STEM+'" stroke-width="2.2" fill="none" opacity=".85">'
      +'<path d="M78 66 C73 92 80 112 96 130"/><path d="M126 56 C132 88 122 110 112 130"/>'
      +'<path d="M102 96 C102 110 105 120 108 130"/><path d="M154 86 C154 104 142 118 126 128"/>'
      +'<path d="M52 92 C54 106 66 118 80 128"/></g>';
    // 叶
    s+=leaf(30,126,50,-58,L2)+leaf(190,124,48,58,L2)+leaf(72,134,54,-15,L1)+leaf(148,132,52,15,L1);
    // 桔梗花苞（细长绿色花蕾，露在玫瑰外圈）
    s+=bud(108,24,11,4,B1,B3)+bud(82,32,10,-12,B2,B3)+bud(152,30,10,16,B1,B3)
      +bud(40,52,9,-26,B2,B3)+bud(170,58,9,22,B1,B3)+bud(60,42,8.5,-18,B1,B3)
      +bud(128,120,8,6,B2,B3)+bud(82,118,7.5,-12,B1,B3)+bud(160,112,7.5,20,B2,B3);
    // 玫瑰
    s+=rose(78,66,24,R1,R2,R3)+rose(126,56,21,W1,W2,W3)+rose(102,96,22,R1,R2,R3)
      +rose(154,86,15,W1,W2,W3)+rose(52,92,15,W1,W2,W3)+rose(112,74,13,W1,W2,W3);
    // 包装纸（内层绿 + 印字）
    s+='<path d="M38 116 C56 162 78 210 96 246 L124 246 C142 210 164 162 182 116 Z" fill="url(#fWrap)"/>';
    s+='<g clip-path="url(#fClip)"><g transform="rotate(-6 110 178)">';
    ['I believe','good things','happen','every day.'].forEach((t,i)=>{
      s+='<text x="110" y="'+(148+i*19)+'" text-anchor="middle" fill="#ffffff" fill-opacity=".94" '
        +'font-family="Segoe Script,Snell Roundhand,Bradley Hand,cursive" font-size="12" font-style="italic">'+t+'</text>';
    });
    s+='</g></g>';
    s+='<path d="M38 116 C56 162 78 210 96 246 L124 246 C142 210 164 162 182 116 Z" fill="none" stroke="rgba(140,168,96,.4)" stroke-width="1"/>';
    // 外层玻璃纸 + 折痕高光
    s+='<path d="M14 92 C32 148 72 216 92 256 L128 256 C148 216 188 148 206 92 C188 110 158 124 110 126 C62 124 32 110 14 92 Z" '
      +'fill="url(#fGlass)" stroke="rgba(255,255,255,.5)" stroke-width="1.4"/>';
    s+='<g fill="none" stroke-linecap="round">'
      +'<path d="M44 102 C60 156 84 214 100 254" stroke="rgba(255,255,255,.34)" stroke-width="2.4"/>'
      +'<path d="M176 102 C160 156 136 214 120 254" stroke="rgba(255,255,255,.26)" stroke-width="2"/>'
      +'<path d="M26 108 C42 152 72 214 90 252" stroke="rgba(255,255,255,.18)" stroke-width="1.6"/>'
      +'<path d="M194 108 C178 152 148 214 130 252" stroke="rgba(255,255,255,.15)" stroke-width="1.6"/></g>';
    s+='</svg>';
    box.innerHTML=s;
  })();

  const cv=document.getElementById('fx'),ctx=cv.getContext('2d');
  function resize(){cv.width=innerWidth;cv.height=innerHeight}resize();addEventListener('resize',resize);
  let parts=[];
  const COLORS=['#ff7eb6','#ffd98a','#8be9fd','#ff4f93','#b98bff','#fff'];
  function burst(x,y){x=x??innerWidth/2;y=y??innerHeight/3;const n=85,color=COLORS[Math.floor(Math.random()*COLORS.length)];
    for(let i=0;i<n;i++){const a=Math.PI*2*i/n,sp=2+Math.random()*4.5;
      parts.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,life:1,color:Math.random()<.28?'#fff':color});}}
  addEventListener('click',e=>{ if(gate.style.display==='none') burst(e.clientX,e.clientY); });
  addEventListener('touchstart',e=>{ if(gate.style.display==='none'){const t=e.touches[0];burst(t.clientX,t.clientY);} },{passive:true});
  (function loop(){ctx.clearRect(0,0,cv.width,cv.height);
    for(let i=parts.length-1;i>=0;i--){const p=parts[i];p.x+=p.vx;p.y+=p.vy;p.vy+=0.05;p.vx*=0.99;p.life-=0.012;
      if(p.life<=0){parts.splice(i,1);continue;}ctx.globalAlpha=Math.max(p.life,0);ctx.fillStyle=p.color;
      ctx.beginPath();ctx.arc(p.x,p.y,2.5,0,7);ctx.fill();}
    ctx.globalAlpha=1;requestAnimationFrame(loop);})();

  const gate=document.getElementById('gate'),stage=document.getElementById('stage');
  document.getElementById('openBtn').onclick=()=>{
    gate.classList.add('open');
    setTimeout(()=>{gate.style.opacity='0';},700);
    setTimeout(()=>{gate.style.display='none';},1700);
    setTimeout(()=>stage.classList.add('show'),1100);
    for(let i=0;i<6;i++) setTimeout(burst, 1300+i*260);
    setTimeout(showLetters, 2000);
    startMusic();
  };

  let loveN=0;const loveCnt=document.getElementById('loveCnt');
  document.getElementById('loveBtn').onclick=(e)=>{
    e.stopPropagation();
    loveN++;loveCnt.textContent='已对你说 '+loveN+' 遍';
    burst(innerWidth/2+(Math.random()*120-60), innerHeight*0.55);
    if(loveN>=9){
      loveCnt.textContent='我数不过来了，反正是一辈子 ❤';
      for(let i=0;i<8;i++) setTimeout(burst, i*160);
      const s=document.createElement('div');s.className='line show';s.style.textAlign='center';
      s.style.marginTop='10px';s.innerHTML='<span class="hl">'+SECRET+'</span>';
      document.getElementById('letterBox').appendChild(s);
    }
  };

  // ===== 背景音乐：Web Audio 水晶八音盒 + 柔和弦乐铺底（慢版）=====
  let actx=null, master=null, reverbInput=null, musicOn=true, musicTimer=null, padTimer=null, melIdx=0, padIdx=0;
  const NOTE={A3:220.00,C4:261.63,D4:293.66,E4:329.63,F4:349.23,G4:392.00,A4:440.00,B4:493.88,
              C5:523.25,D5:587.33,E5:659.25,F5:698.46,G5:783.99};
  const MELODY=[
    ['G4',1],['G4',1],['A4',2],['G4',2],['C5',2],['B4',4],
    ['G4',1],['G4',1],['A4',2],['G4',2],['D5',2],['C5',4],
    ['G4',1],['G4',1],['G5',2],['E5',2],['C5',2],['B4',2],['A4',4],
    ['F5',1],['F5',1],['E5',2],['C5',2],['D5',2],['C5',4]
  ];
  // 每两拍一次的柔和和弦铺底
  const CHORDS=[
    ['C4','E4','G4'],['C4','E4','G4'],['C4','E4','C5'],['A3','C4','E4'],
    ['F4','A4','C5'],['G4','B4','D5'],['C4','E4','G4'],['A3','C4','E4'],
    ['F4','A4','D5'],['G4','B4','D5'],['C4','E4','G4'],['F4','A4','C5']
  ];
  const BEAT=0.46;
  function ensureAudio(){
    if(actx) return;
    actx=new (window.AudioContext||window.webkitAudioContext)();
    master=actx.createGain();master.gain.value=0.55;master.connect(actx.destination);
    reverbInput=makeReverb();
  }
  // 用反馈延迟模拟空间回声，让八音盒更通透
  function makeReverb(){
    const input=actx.createGain();
    const delay=actx.createDelay(1.0);delay.delayTime.value=0.16;
    const fb=actx.createGain();fb.gain.value=0.32;
    const wet=actx.createGain();wet.gain.value=0.42;
    input.connect(delay);delay.connect(fb);fb.connect(delay);delay.connect(wet);wet.connect(master);
    return input;
  }
  // 钟琴/八音盒音色：基频+整数泛音，快速起音、自然衰减
  function bell(freq,t,dur,vol){
    const g=actx.createGain();
    g.gain.setValueAtTime(0.0001,t);
    g.gain.exponentialRampToValueAtTime(vol,t+0.006);
    const end=t+Math.max(dur,0.55);
    g.gain.exponentialRampToValueAtTime(0.0001,end);
    g.connect(master);g.connect(reverbInput);
    [[1,1],[2,0.4],[3,0.18],[4,0.08]].forEach(([m,a])=>{
      const o=actx.createOscillator();o.type='sine';o.frequency.value=freq*m;
      const og=actx.createGain();og.gain.value=a;
      o.connect(og);og.connect(g);o.start(t);o.stop(end+0.1);
    });
  }
  // 柔和弦乐铺底：正弦叠加 + 慢起慢收 + 轻微颤音
  function pad(freqs,t,dur){
    const g=actx.createGain();
    g.gain.setValueAtTime(0.0001,t);
    g.gain.linearRampToValueAtTime(0.05,t+0.55);
    g.gain.linearRampToValueAtTime(0.0001,t+dur);
    g.connect(master);g.connect(reverbInput);
    freqs.forEach(f=>{
      const o=actx.createOscillator();o.type='sine';o.frequency.value=f;
      const og=actx.createGain();og.gain.value=0.5;
      const lfo=actx.createOscillator();lfo.frequency.value=0.18;
      const lg=actx.createGain();lg.gain.value=2;lfo.connect(lg);lg.connect(o.detune);
      o.connect(og);og.connect(g);o.start(t);o.stop(t+dur+0.2);
      lfo.start(t);lfo.stop(t+dur+0.2);
    });
  }
  function startMusic(){
    ensureAudio();
    if(actx.state==='suspended') actx.resume();
    if(musicTimer) return;            // 已在播放，避免叠多份
    document.getElementById('music').classList.add('playing');
    melIdx=0;padIdx=0;
    (function melodyStep(){
      if(!musicOn){ musicTimer=null; return; }
      const [n,d]=MELODY[melIdx];
      bell(NOTE[n], actx.currentTime, d*BEAT*0.95, 0.42);
      const wait=d*BEAT*1000;
      melIdx=(melIdx+1)%MELODY.length;
      musicTimer=setTimeout(melodyStep, wait);
    })();
    padLoop();
  }
  function padLoop(){
    if(!musicOn || padTimer) return;
    (function step(){
      if(!musicOn){ padTimer=null; return; }
      const ch=CHORDS[padIdx%CHORDS.length];
      pad(ch.map(x=>NOTE[x]), actx.currentTime, BEAT*2*0.96);
      padIdx++;
      padTimer=setTimeout(step, BEAT*2*1000);
    })();
  }
  function toggleMusic(){
    ensureAudio();
    if(actx.state==='suspended') actx.resume();
    musicOn=!musicOn;
    const mb=document.getElementById('music');
    if(musicOn){ mb.classList.add('playing'); mb.classList.remove('off'); startMusic(); }
    else{ mb.classList.remove('playing'); mb.classList.add('off');
      clearTimeout(musicTimer); musicTimer=null;
      clearTimeout(padTimer); padTimer=null; }
  }
  document.getElementById('music').onclick=(e)=>{ e.stopPropagation(); toggleMusic(); };
</script>
